[package]
name = "lightcraft-android"
version = "0.11.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lightcraft-ui-egui = { path = "../crates/ui-egui" }
lightcraft-engine = { path = "../crates/engine" }
lightcraft-codecs = { path = "../crates/codecs" }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "android-native-activity", "persistence"] }
egui = { version = "=0.36.2", default-features = false }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
winit = { version = "=0.30.13", default-features = false, features = ["android-native-activity"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 8
strip = "debuginfo"
panic = "unwind"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1

[workspace]
