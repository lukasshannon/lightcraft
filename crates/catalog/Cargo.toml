[package]
name = "lightcraft-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft library: photos, albums, ratings/flags, search/filter/sort, op-log persistence (L3)"

[lints]
workspace = true

[dependencies]
lightcraft-develop = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raw = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
web-time = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# std's File::try_lock is not implemented on Android. Rustix supplies a safe
# wrapper for the same flock operation and releases it on process death.
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
lightcraft-geom = { workspace = true }
proptest = { workspace = true }
